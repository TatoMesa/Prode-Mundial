{% extends "base.html" %}
{% block title %}Recuperar contraseña — Prode Mundial{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">

                    <div class="text-center mb-3" style="font-size:2rem">🔑</div>
                    <h1 class="h5 text-center mb-1">Recuperar contraseña</h1>
                    <p class="text-muted text-center small mb-4">
                    Ingresá tu email y te enviamos un link para restablecer tu contraseña.
                    </p>

                    <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                            placeholder="tu@email.com" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-success w-100 rounded-pill fw-semibold">
                        Enviar link
                    </button>
                    </form>

                    <p class="text-center mt-3 small">
                    <a href="{% url 'accounts:login' %}">← Volver al login</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
