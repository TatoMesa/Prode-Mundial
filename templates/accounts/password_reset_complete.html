<!-- templates/accounts/password_reset_complete.html -->
{% extends "base.html" %}
{% block title %}Contraseña actualizada — Prode Mundial{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 text-center">
            <div class="card-body p-4">
                <div class="mb-3" style="font-size:2.5rem">✅</div>
                <h1 class="h5 mb-2">¡Contraseña actualizada!</h1>
                <p class="text-muted small mb-4">
                Tu contraseña fue cambiada correctamente. Ya podés iniciar sesión.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-success rounded-pill px-4 fw-semibold">
                Iniciar sesión
                </a>
            </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
