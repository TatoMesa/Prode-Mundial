{% extends "base.html" %}
{% block title %}Email enviado — Prode Mundial{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 text-center">
            <div class="card-body p-4">
                <div class="mb-3" style="font-size:2.5rem">📧</div>
                <h1 class="h5 mb-2">Revisá tu email</h1>
                <p class="text-muted small mb-4">
                Si el email está registrado, vas a recibir un link
                para restablecer tu contraseña en los próximos minutos.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-success rounded-pill px-4">
                Volver al login
                </a>
            </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
